[project]
name = "mcp-postgres-starter"
version = "0.1.0"
description = "Remote MCP server that connects Claude to a PostgreSQL database, with scoped bearer tokens, row limits and an audit log."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "psycopg[binary,pool]>=3.2",
]

[project.scripts]
mcp-postgres-starter = "mcp_postgres_starter.__main__:main"
mcp-postgres-starter-seed = "mcp_postgres_starter.seed:main"
mcp-postgres-starter-token = "mcp_postgres_starter.auth:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_postgres_starter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
